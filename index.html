<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Merry Christmas I Miss You</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050611;
    font-family: Helvetica, Arial, sans-serif;
}


/* OPENING */

#opening {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            #171936 0%,
            #090a17 45%,
            #030409 100%
        );
    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#opening.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.opening-content {
    width: 88%;
    max-width: 360px;
    text-align: center;
    color: white;
}

.music-icon {
    width: 86px;
    height: 86px;
    margin: 0 auto 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle,
            #35365d,
            #181a35
        );
    box-shadow:
        0 0 20px rgba(117,113,184,0.45),
        0 0 60px rgba(117,113,184,0.15);
    animation: pulse 2.5s infinite;
}

.music-note {
    font-size: 38px;
    color: #fff;
    text-shadow:
        0 0 10px white,
        0 0 25px #7571B8;
}

@keyframes pulse {

    0% {
        transform: scale(1);
        box-shadow:
            0 0 20px rgba(117,113,184,0.45),
            0 0 60px rgba(117,113,184,0.15);
    }

    50% {
        transform: scale(1.06);
        box-shadow:
            0 0 30px rgba(117,113,184,0.65),
            0 0 80px rgba(117,113,184,0.25);
    }

    100% {
        transform: scale(1);
        box-shadow:
            0 0 20px rgba(117,113,184,0.45),
            0 0 60px rgba(117,113,184,0.15);
    }

}

.opening-small {
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.55;
    margin-bottom: 12px;
}

.opening-title {
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.opening-subtitle {
    font-size: 14px;
    opacity: 0.55;
    margin-bottom: 34px;
}

.play-button {
    position: relative;
    width: 100%;
    height: 54px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 30px;
    background:
        rgba(255,255,255,0.07);
    color: white;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    overflow: hidden;
    box-shadow:
        0 0 25px rgba(117,113,184,0.12);
}

.play-button::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.12),
            transparent
        );
    transform: translateX(-100%);
    animation: shine 3s infinite;
}

@keyframes shine {

    0% {
        transform: translateX(-100%);
    }

    50% {
        transform: translateX(100%);
    }

    100% {
        transform: translateX(100%);
    }

}

.play-button span {
    position: relative;
    z-index: 2;
}

.opening-footer {
    margin-top: 22px;
    font-size: 11px;
    opacity: 0.35;
}


/* MAIN */

#main {
    position: fixed;
    inset: 0;
    opacity: 0;
    transition: opacity 1.5s ease;
}

#main.show {
    opacity: 1;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#lyrics {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 94%;
    text-align: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    z-index: 10;
    white-space: nowrap;
    text-shadow:
        0 0 5px white,
        0 0 10px white,
        0 0 20px rgba(255,255,255,0.8);
}


/* PAGE 3 */

#page3 {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at center,
            #171936 0%,
            #090a17 45%,
            #030409 100%
        );
    opacity: 0;
    visibility: hidden;
    transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
}

#page3.show {
    opacity: 1;
    visibility: visible;
}

.page3-content {
    width: 88%;
    max-width: 380px;
    text-align: center;
    color: white;
}

.page3-heart {
    font-size: 64px;
    margin-bottom: 25px;
    animation: heartPulse 2s infinite;
    text-shadow:
        0 0 15px white,
        0 0 35px #7571B8;
}

@keyframes heartPulse {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.12);
    }

    100% {
        transform: scale(1);
    }

}

.page3-small {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.45;
    margin-bottom: 14px;
}

.page3-title {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-bottom: 14px;
}

.page3-text {
    font-size: 15px;
    line-height: 1.8;
    opacity: 0.7;
}

.page3-line {
    width: 55px;
    height: 1px;
    margin: 25px auto;
    background: rgba(255,255,255,0.4);
}

.page3-footer {
    font-size: 11px;
    opacity: 0.35;
    letter-spacing: 2px;
}

</style>

</head>

<body>


<div id="opening">

    <div class="opening-content">

        <div class="music-icon">
            <div class="music-note">♫</div>
        </div>

        <div class="opening-small">
            A little song for you
        </div>

        <div class="opening-title">
            Merry Christmas
        </div>

        <div class="opening-subtitle">
            I Miss You
        </div>

        <button
            class="play-button"
            id="playButton">

            <span>▶ &nbsp; PLAY SONG</span>

        </button>

        <div class="opening-footer">
            turn up the volume
        </div>

    </div>

</div>


<div id="main">

    <audio id="music">

        <source
            src="ssstik.io_1789396187548.mp3"
            type="audio/mpeg">

    </audio>

    <canvas id="canvas"></canvas>

    <div id="lyrics"></div>

</div>


<div id="page3">

    <div class="page3-content">

        <div class="page3-heart">
            ♡
        </div>

        <div class="page3-small">
            the song has ended
        </div>

        <div class="page3-title">
            I Miss You
        </div>

        <div class="page3-text">
            Some songs end,<br>
            but some feelings stay.
        </div>

        <div class="page3-line"></div>

        <div class="page3-footer">
            MERRY CHRISTMAS
        </div>

    </div>

</div>


<script>

const opening =
    document.getElementById("opening");

const main =
    document.getElementById("main");

const playButton =
    document.getElementById("playButton");

const music =
    document.getElementById("music");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const label =
    document.getElementById("lyrics");

const page3 =
    document.getElementById("page3");


music.volume = 1;


const lyrics = [

    ["You know it's true", 0.10, 3.3],

    ["Yeah i miss you", 0.08, 3.2],

    ["You know it's true", 0.09, 2.9],

    ["So, What if i call?", 0.06, 2.7],

    ["And you pick up the phone", 0.06, 2.9],

    ["And i use this holiday", 0.10, 1.8],

    ["To make my way to your ghost", 0.08, 3.4],

    ["Oh, what if you're lonely?", 0.07, 2.9],

    ["You know i am too", 0.06, 2.8],

    ["And i get the chance to say", 0.10, 1.4],

    ["Merry Christmas i miss you", 0.10, 3.2],

    ["I MISS YOU", 0.10, 5.0]

];


let width;
let height;

function resize() {

    width =
        canvas.width =
        window.innerWidth;

    height =
        canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);


const particles = [];

const rainColors = [
    "#87CEFA",
    "#4682B4",
    "#B0C4DE"
];

const snowColors = [
    "#FFF8DC",
    "#F0FFFF",
    "#D3D3D3"
];

const sparkleColors = [
    "#304379",
    "#6D68A1",
    "#3E6579"
];

const butterflyColors = [
    "#7571B8",
    "#4F448B",
    "#FFF8DC"
];

const kinds = [
    "raindrop",
    "snow",
    "sparkle",
    "butterfly"
];


function random(min, max) {

    return Math.random() *
        (max - min) + min;

}


function randomInt(min, max) {

    return Math.floor(
        random(min, max + 1)
    );

}


function createParticle() {

    const kind =
        kinds[
            randomInt(
                0,
                kinds.length - 1
            )
        ];

    const particle = {

        x: random(0, width),

        y: random(0, height),

        kind: kind,

        size: randomInt(2, 6),

        speed: 1,

        color: "#FFFFFF"

    };


    if (kind === "raindrop") {

        particle.length =
            randomInt(8, 15);

        particle.speed = 3;

        particle.color =
            rainColors[
                randomInt(
                    0,
                    rainColors.length - 1
                )
            ];

    }


    if (kind === "snow") {

        particle.char = "❆";

        particle.color =
            snowColors[
                randomInt(
                    0,
                    snowColors.length - 1
                )
            ];

    }


    if (kind === "sparkle") {

        particle.char = "✦";

        particle.color =
            sparkleColors[
                randomInt(
                    0,
                    sparkleColors.length - 1
                )
            ];

    }


    if (kind === "butterfly") {

        particle.char = "🦋";

        particle.size += 4;

        particle.color =
            butterflyColors[
                randomInt(
                    0,
                    butterflyColors.length - 1
                )
            ];

    }


    particles.push(particle);

}


for (let i = 0; i < 150; i++) {

    createParticle();

}


function drawParticle(p) {

    if (p.kind === "raindrop") {

        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y
        );

        ctx.lineTo(
            p.x,
            p.y + p.length
        );

        ctx.strokeStyle =
            p.color;

        ctx.lineWidth = 1;

        ctx.stroke();

    }

    else {

        ctx.font =
            `${p.size}px Helvetica, Arial, sans-serif`;

        ctx.fillStyle =
            p.color;

        ctx.fillText(
            p.char,
            p.x,
            p.y
        );

    }

}


function animateParticles() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    for (const p of particles) {

        p.y += p.speed;


        if (p.y > height + 20) {

            p.y = -20;

            p.x =
                random(0, width);

        }


        drawParticle(p);

    }


    requestAnimationFrame(
        animateParticles
    );

}


animateParticles();


function twinkleParticles() {

    for (const p of particles) {

        if (p.kind === "snow") {

            p.color =
                snowColors[
                    randomInt(
                        0,
                        snowColors.length - 1
                    )
                ];

        }


        if (p.kind === "sparkle") {

            p.color =
                sparkleColors[
                    randomInt(
                        0,
                        sparkleColors.length - 1
                    )
                ];

        }


        if (p.kind === "butterfly") {

            p.color =
                butterflyColors[
                    randomInt(
                        0,
                        butterflyColors.length - 1
                    )
                ];

        }

    }


    setTimeout(
        twinkleParticles,
        500
    );

}


twinkleParticles();


let currentLyric = -1;
let lyricTimer = null;


function showLyric(index) {

    clearTimeout(
        lyricTimer
    );

    const text =
        lyrics[index][0];

    const charDelay =
        lyrics[index][1] * 1000;

    const lineDelay =
        lyrics[index][2] * 1000;

    label.textContent = "";

    let charIndex = 0;


    function typeCharacter() {

        if (
            charIndex < text.length
        ) {

            label.textContent +=
                text.charAt(charIndex);

            charIndex++;


            lyricTimer =
                setTimeout(
                    typeCharacter,
                    charDelay
                );

        }

        else {

            lyricTimer =
                setTimeout(
                    nextLyric,
                    lineDelay
                );

        }

    }


    typeCharacter();

}


function nextLyric() {

    currentLyric++;

    if (
        currentLyric >=
        lyrics.length
    ) {

        label.textContent = "";

        return;

    }


    showLyric(
        currentLyric
    );

}


function startSong() {

    music.currentTime = 0;

    music.play();

    opening.classList.add("hide");

    main.classList.add("show");

    page3.classList.remove("show");

    currentLyric = -1;

    nextLyric();

}


music.addEventListener(
    "ended",
    function() {

        clearTimeout(
            lyricTimer
        );

        label.textContent = "";

        page3.classList.add("show");

    }
);


playButton.addEventListener(
    "click",
    startSong
);


</script>

</body>

</html>
